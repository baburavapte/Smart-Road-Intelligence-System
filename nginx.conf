server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Single Page Application fallback routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API Proxy to Express Gateway
    location /api/ {
        proxy_pass http://express-backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Static media uploads proxy
    location /uploads/ {
        proxy_pass http://express-backend:3000/uploads/;
    }

    # Socket.io WebSocket connection proxy
    location /socket.io/ {
        proxy_pass http://express-backend:3000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }
}
